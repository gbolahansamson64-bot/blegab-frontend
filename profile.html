<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- ---------------------------------------------------------------
       Sign-in guard: runs before anything paints, so a logged-out
       visitor never sees a flash of this page before being sent to
       login. Reads the SAME localStorage key main.js's BLEGAB_AUTH
       uses ('blegab_user'), since main.js itself hasn't loaded yet
       at this point in <head>.
       Once real auth/session cookies exist, swap this check for
       whatever server-side or session check replaces it.
       --------------------------------------------------------------- */
  <script>
    (function () {
      try {
        var user = JSON.parse(localStorage.getItem('blegab_user'));
        if (!user) window.location.replace('login.html');
      } catch (e) {
        window.location.replace('login.html');
      }
    })();
  </script>

  <!-- Theme: apply saved preference immediately to avoid a flash of the wrong theme -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('blegab_theme');
        if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    })();
  </script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
  <title>My Profile | Blegab Luxury Wigs</title>
  <meta name="description" content="Manage your Blegab Luxury Wigs account details, photo and shipping information." />

  <!-- Fonts: display serif for headings, sans for body/UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/header.css" />
  <link rel="stylesheet" href="assets/css/footer.css" />
  <link rel="stylesheet" href="assets/css/profile.css" />
  <link rel="stylesheet" href="assets/css/custom-select.css" />
  <link rel="icon" type="image/webp" href="assets/images/farvicon.webp" />
</head>
<body>

  <!-- =========================================================
       HEADER
       ========================================================= -->
  <div data-site-header></div>
  <script src="assets/js/header.js"></script>

  <!-- =========================================================
       PROFILE PAGE
       ========================================================= -->
  <main class="profile-page">
    <div class="container profile-page__container">

      <!-- Toolbar: back button, title, theme toggle, view collections -->
      <div class="profile-toolbar">
        <button type="button" class="profile-back-btn" data-back-btn aria-label="Go back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M15 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Back
        </button>

        <div class="profile-toolbar__right">

          <a href="shop.html" class="btn btn-outline profile-toolbar__shop">
            View Collections
          </a>

          <a href="my-orders.html" class="btn btn-outline profile-toolbar__shop">
            View Orders
          </a>
        </div>
      </div>

      <!-- Page heading -->
      <div class="profile-heading">
        <span class="eyebrow-text">Account</span>
        <h1 class="profile-heading__title">My Profile</h1>
        <p class="profile-heading__subtitle">Keep your photo and details up to date. This stays saved to your account, so it's here whenever you sign back in.</p>
      </div>

      <!-- Profile form -->
      <form class="profile-card" data-profile-form novalidate>
        <div class="profile-card__grid">

          <!-- Avatar uploader -->
          <div class="profile-avatar-col">
            <div class="avatar-uploader" data-avatar-uploader>
              <button type="button" class="avatar-uploader__dropzone" data-avatar-dropzone aria-label="Upload profile image">
                <svg class="avatar-uploader__placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                  <rect x="3" y="4" width="18" height="16" rx="2"/>
                  <circle cx="8.5" cy="9.5" r="1.75"/>
                  <path d="M21 16l-5.2-5.2a2 2 0 0 0-2.8 0L4 19" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>

                <img class="avatar-uploader__image" data-avatar-image alt="Your profile photo" hidden />

                <span class="avatar-uploader__overlay" data-avatar-overlay>
                  <svg class="avatar-uploader__plus-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M12 5v14M5 12h14" stroke-linecap="round"/>
                  </svg>
                  <span class="avatar-uploader__overlay-text">Upload Image</span>
                </span>
              </button>

              <div class="avatar-uploader__actions" data-avatar-actions hidden>
                <button type="button" class="avatar-uploader__action-btn" data-avatar-edit aria-label="Change photo">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
                <button type="button" class="avatar-uploader__action-btn avatar-uploader__action-btn--delete" data-avatar-delete aria-label="Remove photo">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-8 0 1 12a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2l1-12" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
              </div>

              <input
  type="file"
  accept="image/png, image/jpeg, image/webp"
  data-avatar-input
  class="visually-hidden"
/>
            </div>
            <p class="avatar-uploader__hint" data-avatar-hint>JPG, PNG or WEBP. One photo, up to 5MB.</p>
          </div>

          <!-- Fields beside the avatar: name + email only -->
          <div class="profile-fields-col">

            <div class="field-row field-row--2">
              <div class="field">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName" data-field="firstName" autocomplete="given-name" placeholder="e.g. Amara" />
              </div>
              <div class="field">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" data-field="lastName" autocomplete="family-name" placeholder="e.g. Okafor" />
              </div>
            </div>

            <!-- Email: its own full-width row -->
            <div class="field" data-field-wrap="email">
              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" data-field="email" autocomplete="email" placeholder="you@example.com" />
              <span class="field-error" data-field-error="email" hidden>Enter a valid email address (e.g. name@example.com)</span>
            </div>

          </div>

          <!-- Everything from Phone Number down: full card width, below the avatar row -->
          <div class="profile-fields-full">

            <!-- Phone: its own full-width row, country code + number side by side -->
            <div class="field">
              <label for="phone">Phone Number</label>
              <div class="phone-field">
                <select id="phoneCode" name="phoneCode" data-field="phoneCode" aria-label="Country">
                  <option value="">Country</option>
                </select>
                <div class="phone-number-wrap">
                  <span class="phone-code-prefix" data-phone-prefix hidden></span>
                  <input type="tel" id="phone" name="phone" data-field="phone" autocomplete="tel" inputmode="numeric" maxlength="10" placeholder="Phone number" />
                </div>
              </div>
            </div>

            <div class="field-row field-row--2">
              <div class="field">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" data-field="dob" autocomplete="bday" />
              </div>
              <div class="field">
                <label for="gender">Gender</label>
                <select id="gender" name="gender" data-field="gender">
                  <option value="">Prefer not to say</option>
                  <option value="female">Female</option>
                  <option value="male">Male</option>
                  <option value="other">Other</option>
                </select>
              </div>
            </div>

            <div class="field-divider">
              <span class="eyebrow-text">Profile Address</span>
            </div>

            <div class="field">
              <label for="address">Address</label>
              <input type="text" id="address" name="address" data-field="address" autocomplete="street-address" placeholder="Street address" />
            </div>

            <div class="field">
              <label for="country">Country</label>
              <select id="country" name="country" data-field="country" autocomplete="country-name">
                <option value="">Select a country</option>
              </select>
            </div>

            <div class="field-row field-row--3">
              <div class="field">
                <label for="state">State / Region</label>
                <select id="state" name="state" data-field="state" autocomplete="address-level1">
  <option value="">Select a country first</option>
</select>
              </div>
              <div class="field">
                <label for="city">City</label>
                <input type="text" id="city" name="city" data-field="city" autocomplete="address-level2" list="cityList" placeholder="Select a state first" disabled />
                <datalist id="cityList"></datalist>
              </div>
              <div class="field">
                <label for="postalCode">Postal Code</label>
                <input type="text" id="postalCode" name="postalCode" data-field="postalCode" autocomplete="postal-code" />
              </div>
            </div>



            <div class="profile-card__footer">
              <span class="profile-save-status" data-save-status></span>
              <button type="submit" class="btn btn-primary profile-save-btn" data-save-btn disabled>
                Save Changes
              </button>
            </div>

          </div>
        </div>
      </form>

    </div>
  </main>

<script src="assets/js/main.js"></script>
<script src="assets/js/custom-select.js"></script>

<script type="module" src="assets/js/profile.js"></script>

  <div data-site-footer></div>
  <script src="assets/js/footer.js"></script>

</body>
</html>

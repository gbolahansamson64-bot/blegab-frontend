<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Developer | Blegab Luxury Wigs</title>
  <meta name="description" content="This site was designed and built by Gbolly Tech." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />

  <!-- Fonts: display serif for headings, sans for body/UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/header.css" />
  <link rel="stylesheet" href="assets/css/footer.css" />
  <link rel="stylesheet" href="assets/css/whatsapp-chat.css" />
  <link rel="stylesheet" href="assets/css/cookie.css" />
  <link rel="icon" type="image/webp" href="assets/images/farvicon.webp" />

  <style>
    .dev-page {
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-md);
      padding: 120px var(--page-gutter) 80px;
      background-color: var(--color-bg-dark);
    }

    .dev-page__back {
      display: none;
      margin-right:80%;
      margin-bottom:40px;
      font-size: 20px;
    }

    .dev-card {
      max-width: 480px;
      width: 100%;
      text-align: center;
      padding: var(--space-2xl);
      border: 1px solid var(--color-border-dark);
      border-radius: var(--radius-md);
      background-color: var(--color-bg-dark-alt);
    }

    .dev-card__eyebrow {
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--color-gold);
      margin-bottom: var(--space-sm);
    }

    .dev-card__title {
      font-family: var(--font-display);
      font-size: 26px;
      color: var(--color-white);
      margin-bottom: var(--space-md);
    }

    .dev-card__text {
      font-size: 14px;
      line-height: 1.7;
      color: var(--color-text-muted);
      margin-bottom: var(--space-lg);
    }

    .dev-card__link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 28px;
      border-radius: var(--radius-pill);
      background-color: var(--color-gold);
      color: #1a1a1a;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: background-color var(--transition-fast);
    }

    .dev-card__link:hover {
      background-color: var(--color-gold-light);
    }
    @media (max-width: 1023px) {
      .dev-page__back {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border: 1px solid var(--color-border-dark);
        border-radius: var(--radius-pill);
        background: transparent;
        color: var(--color-text-muted);
        font-size: 30px;
        line-height: 1;
        cursor: pointer;
        transition: border-color var(--transition-fast), color var(--transition-fast);
      }

      .dev-page__back:hover {
        border-color: var(--color-gold);
        color: var(--color-gold);
      }
    }

    @media (max-width: 480px) {
      .dev-page {
        padding: 90px 20px 60px;
        min-height: 50vh;
      }

      .dev-card {
        padding: var(--space-lg);
      }

      .dev-card__title {
        font-size: 20px;
      }

      .dev-card__text {
        font-size: 13px;
      }

      .dev-card__link {
        width: 100%;
        padding: 12px 20px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- =========================================================
       HEADER
       ========================================================= -->
  <div data-site-header></div>
  <script src="assets/js/header.js"></script>

  <main>
    <section class="dev-page" aria-label="Developer credit">
      <button type="button" class="dev-page__back" onclick="history.back()" aria-label="Go back"><</button>
      <div class="dev-card">
        <p class="dev-card__eyebrow">Site Credit</p>
        <h1 class="dev-card__title">Designed &amp; Built By Gbolly Tech</h1>
        <p class="dev-card__text">
          This website was crafted end-to-end by Gbolly Tech — from design to development.
          For custom websites, landing pages, and e-commerce builds, check out more work below.
        </p>
        <a href="https://gbollytech.vercel.app" target="_blank" rel="noopener noreferrer" class="dev-card__link">
          visit developer site
        </a>
      </div>
    </section>
  </main>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/cookie.js"></script>

  <div data-site-footer></div>
  <script src="assets/js/footer.js"></script>

</body>
</html>

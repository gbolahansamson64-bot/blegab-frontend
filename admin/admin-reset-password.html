<!-- admin-reset-password.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Admin Credential | Blegab Luxury Wigs</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/admin-base.css" />
  <link rel="stylesheet" href="assets/css/admin-auth.css" />
  <link rel="icon" type="image/webp" href="assets/images/favicon.webp" />
</head>
<body class="admin-body admin-auth-body">

  <main class="admin-auth-page">
    <div class="admin-auth-card">

<div class="admin-auth-logo">
  <img src="assets/images/adminlogo.webp" alt="Blegab Luxury Wigs" class="admin-auth-logo-mark" />
</div>

      <div class="admin-auth-lock">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="5" y="11" width="14" height="9" rx="2"/>
          <path d="M8 11V7a4 4 0 0 1 8 0v4" stroke-linecap="round"/>
        </svg>
      </div>

      <h1 class="admin-auth-title" data-reset-title>Reset Password</h1>
      <p class="admin-auth-subtitle" data-reset-subtitle>Enter and confirm a new admin password.</p>

      <p class="admin-auth-error" data-auth-error hidden></p>

      <form class="admin-auth-form" data-admin-reset-form novalidate>

        <!-- Password fields (shown when ?type=password or no type given) -->
        <div data-reset-password-fields>
          <div class="admin-auth-field admin-auth-field--password-dropdown">
            <label class="admin-auth-label" for="admin-reset-new-password">New Password</label>
            <div class="admin-auth-password-wrap">
              <input class="admin-auth-input" type="password" id="admin-reset-new-password" name="newPassword" autocomplete="new-password" minlength="8" data-pw-checklist-input />
              <button type="button" class="admin-auth-password-toggle" data-password-toggle aria-label="Show password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12z" stroke-linecap="round" stroke-linejoin="round"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>

            <div class="admin-pw-checklist">
              <div class="admin-pw-checklist__item" data-check="uppercase">
                <span class="admin-pw-checklist__box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                Uppercase letter
              </div>
              <div class="admin-pw-checklist__item" data-check="lowercase">
                <span class="admin-pw-checklist__box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                Lowercase letter
              </div>
              <div class="admin-pw-checklist__item" data-check="number">
                <span class="admin-pw-checklist__box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                Number
              </div>
              <div class="admin-pw-checklist__item" data-check="length">
                <span class="admin-pw-checklist__box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                At least 8 characters
              </div>
              <div class="admin-pw-checklist__item" data-check="symbol">
                <span class="admin-pw-checklist__box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                Symbol ( # @ * , . )
              </div>
            </div>
          </div>

          <div class="admin-auth-field">
            <label class="admin-auth-label" for="admin-reset-confirm-password">Confirm New Password</label>
            <input class="admin-auth-input" type="password" id="admin-reset-confirm-password" name="confirmNewPassword" autocomplete="new-password" minlength="8" />
          </div>
        </div>

        <!-- Access code fields (shown when ?type=code) -->
        <div data-reset-code-fields hidden>
          <div class="admin-auth-field">
            <label class="admin-auth-label" for="admin-reset-new-code">New Access Code</label>
            <div class="admin-auth-password-wrap">
              <input class="admin-auth-input" type="password" id="admin-reset-new-code" name="newAccessCode" autocomplete="off" inputmode="numeric" pattern="[0-9]*" maxlength="8" data-access-code-input />
              <button type="button" class="admin-auth-password-toggle" data-password-toggle aria-label="Show access code">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12z" stroke-linecap="round" stroke-linejoin="round"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <span class="admin-auth-hint">Must be exactly 8 digits, numbers only.</span>
          </div>

          <div class="admin-auth-field">
            <label class="admin-auth-label" for="admin-reset-confirm-code">Confirm New Access Code</label>
            <input class="admin-auth-input" type="password" id="admin-reset-confirm-code" name="confirmAccessCode" autocomplete="off" inputmode="numeric" pattern="[0-9]*" maxlength="8" data-access-code-input />
          </div>
        </div>

        <button type="submit" class="admin-auth-submit" data-submit-btn>
          <span class="admin-auth-submit-text" data-reset-submit-text>Save New Password</span>
          <span class="admin-auth-spinner" data-submit-spinner hidden></span>
        </button>
      </form>

      <p class="admin-auth-footer">
        <a href="admin-login.html" class="admin-auth-link">Back to Sign In</a>
      </p>
    </div>
  </main>

  <script src="assets/js/admin-data.js"></script>
  <script src="assets/js/admin.js"></script>
  <script src="assets/js/admin-auth.js"></script>
</body>
</html>
